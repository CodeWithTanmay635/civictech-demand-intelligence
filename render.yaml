services:
  # ── 1. Frontend — React/Vite Static Site ──────────────────────────────────
  - type: web
    name: civictech-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: civictech-core-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_AI_ENGINE_URL
        fromService:
          type: web
          name: civictech-ai-engine
          envVarKey: RENDER_EXTERNAL_URL

  # ── 2. Core API — Spring Boot ──────────────────────────────────────────────
  - type: web
    name: civictech-core-api
    env: docker
    region: singapore
    plan: free
    rootDir: core-api
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: civictech-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: civictech-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: civictech-postgres
          property: password
      - key: AI_ENGINE_URL
        fromService:
          name: civictech-ai-engine
          type: web
          property: host

  # ── 3. AI Spatial Engine — FastAPI (Python) ────────────────────────────────
  - type: web
    name: civictech-ai-engine
    runtime: python
    region: singapore
    plan: free
    rootDir: ai-spatial-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

# ── PostgreSQL Managed Database ────────────────────────────────────────────────
databases:
  - name: civictech-postgres
    region: singapore
    plan: free
    databaseName: civictech
